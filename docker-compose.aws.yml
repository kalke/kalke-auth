# Production stack for AWS Free Tier EC2 (prefer t3.small / 2 GB with Postgres).
# Keycloak + Go BFF behind Caddy (auth.kalke.dev).
# Keycloak admin UI via Cloudflare Tunnel + Access (keycloak.kalke.dev).
# Postgres is Docker-only — do not publish :5432.
#
#   cp prod.env.example prod.env   # POSTGRES_PASSWORD, Redis, Mailgun, KC, PDE_*, EBANK_*
#   make aws-up
#
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kalke}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in prod.env}
      POSTGRES_DB: ${POSTGRES_DB:-kalke}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=50
      - -c
      - effective_cache_size=128MB
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    mem_limit: 192m
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-group: /kalke/auth
        awslogs-create-group: "true"

  auth:
    build: .
    image: kalke-auth:aws
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - prod.env
    environment:
      KC_HTTP_PORT: "8081"
      HTTP_ADDR: ":8080"
      KC_INTERNAL_URL: "http://127.0.0.1:8081"
      KC_PUBLIC_ISSUER: "https://auth.kalke.dev/realms/kalke"
      KC_HOSTNAME: "https://keycloak.kalke.dev"
      KC_HOSTNAME_ADMIN: "https://keycloak.kalke.dev"
      KC_REALM_FRONTEND_URL: "https://auth.kalke.dev"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-Xms192m -Xmx384m"
      DB_SEARCH_PATH: "app"
      REDIS_TLS: "true"
      COOKIE_DOMAIN: ".kalke.dev"
      LOG_LEVEL: info
      LOG_FORMAT: json
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SECRET_ID: ${AUTH_SECRET_ID:-kalke/kalke-auth/prod}
      POSTGRES_USER: ${POSTGRES_USER:-kalke}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in prod.env}
      POSTGRES_DB: ${POSTGRES_DB:-kalke}
      KC_DB: postgres
      KC_DB_USERNAME: ${POSTGRES_USER:-kalke}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in prod.env}
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kalke}?sslmode=disable&currentSchema=keycloak
      DATABASE_URL: postgres://${POSTGRES_USER:-kalke}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in prod.env}@postgres:5432/${POSTGRES_DB:-kalke}?sslmode=disable
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-group: /kalke/auth
        awslogs-create-group: "true"
    expose:
      - "8080"
      - "8081"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 240s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    mem_limit: 64m
    volumes:
      - ./Caddyfile.aws:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Zero Trust Tunnel — public hostname keycloak.kalke.dev → http://auth:8081
  # Keycloak admin UI via Cloudflare Tunnel + Access (not public Caddy).
  tunnel:
    image: cloudflare/cloudflared:2025.8.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - prod.env
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      auth:
        condition: service_healthy
    mem_limit: 64m
    profiles:
      - tunnel

volumes:
  caddy_data:
  caddy_config:
  pgdata:
