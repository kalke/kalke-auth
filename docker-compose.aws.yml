# Production stack for AWS Free Tier EC2 (t3.micro / t2.micro).
# Keycloak + Go BFF in one image, Caddy for TLS.
#
#   cp prod.env.example prod.env   # fill secrets
#   make aws-up
#
# t3.micro has ~1 GB RAM — bootstrap MUST create swap (see deploy/aws-bootstrap.sh).
services:
  auth:
    build: .
    image: kalke-auth:aws
    restart: unless-stopped
    env_file:
      - prod.env
    environment:
      KC_HTTP_PORT: "8081"
      HTTP_ADDR: ":8080"
      KC_INTERNAL_URL: "http://127.0.0.1:8081"
      KC_PUBLIC_ISSUER: "https://auth.kalke.dev/realms/kalke"
      KC_HOSTNAME: "https://auth.kalke.dev"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HEALTH_ENABLED: "true"
      # Fit Free Tier 1 GB RAM (OS + Docker + Caddy + Keycloak + Go).
      JAVA_OPTS_KC_HEAP: "-Xms192m -Xmx384m"
      DB_SEARCH_PATH: "app"
      REDIS_TLS: "true"
      COOKIE_DOMAIN: ".kalke.dev"
    expose:
      - "8080"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 240s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    mem_limit: 64m
    volumes:
      - ./Caddyfile.aws:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
