# Production stack for AWS Free Tier EC2 (t3.micro / t2.micro).
# Keycloak + Go BFF behind Caddy (auth.kalke.dev).
# Keycloak admin UI via Cloudflare Tunnel + Access (keycloak.kalke.dev).
#
#   cp prod.env.example prod.env   # fill secrets + CLOUDFLARE_TUNNEL_TOKEN
#   make aws-up
#
services:
  auth:
    build: .
    image: kalke-auth:aws
    restart: unless-stopped
    env_file:
      - prod.env
    environment:
      KC_HTTP_PORT: "8081"
      HTTP_ADDR: ":8080"
      KC_INTERNAL_URL: "http://127.0.0.1:8081"
      KC_PUBLIC_ISSUER: "https://auth.kalke.dev/realms/kalke"
      # Keycloak frontend+admin both on Tunnel (Access). Split hostname broke the
      # admin SPA: auth-server-url pointed at auth.kalke.dev where BFF ≠ Keycloak.
      # Realm kalke keeps issuer via attributes.frontendUrl (see entrypoint).
      KC_HOSTNAME: "https://keycloak.kalke.dev"
      KC_HOSTNAME_ADMIN: "https://keycloak.kalke.dev"
      KC_REALM_FRONTEND_URL: "https://auth.kalke.dev"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HEALTH_ENABLED: "true"
      # Fit Free Tier 1 GB RAM (OS + Docker + Caddy + Keycloak + Go).
      JAVA_OPTS_KC_HEAP: "-Xms192m -Xmx384m"
      DB_SEARCH_PATH: "app"
      REDIS_TLS: "true"
      COOKIE_DOMAIN: ".kalke.dev"
    expose:
      - "8080"
      - "8081"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 240s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    mem_limit: 64m
    volumes:
      - ./Caddyfile.aws:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Zero Trust Tunnel — public hostname keycloak.kalke.dev → http://auth:8081
  # Configure hostname + Access policy in Cloudflare dashboard (see DEPLOY.md).
  tunnel:
    image: cloudflare/cloudflared:2025.8.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - prod.env
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      auth:
        condition: service_healthy
    mem_limit: 64m
    profiles:
      - tunnel

volumes:
  caddy_data:
  caddy_config:
