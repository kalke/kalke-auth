name: Migrate Neon to EC2 Postgres

on:
  workflow_dispatch:
    inputs:
      force:
        description: Overwrite existing local Postgres data
        type: boolean
        default: false

jobs:
  migrate:
    name: Dump Neon into Docker Postgres
    runs-on: [self-hosted, linux, kalke-auth-ec2]
    timeout-minutes: 30
    steps:
      - name: Run migrate-from-neon on the instance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_DIR: /home/ubuntu/kalke-auth
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [[ ! -d "${REPO_DIR}/.git" ]]; then
            echo "clone kalke-auth onto the instance first" >&2
            exit 1
          fi
          cd "${REPO_DIR}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/kalke/kalke-auth.git"
          git fetch --depth=1 origin main
          git checkout -f -B main FETCH_HEAD
          git remote set-url origin "https://github.com/kalke/kalke-auth.git"
          chmod +x deploy/migrate-from-neon.sh
          if [[ "${FORCE}" == "true" ]]; then
            bash deploy/migrate-from-neon.sh --force
          else
            bash deploy/migrate-from-neon.sh
          fi
          docker compose -f docker-compose.aws.yml --env-file prod.env up -d --no-deps auth
