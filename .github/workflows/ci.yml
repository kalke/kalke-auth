name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate realm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check

  go:
    name: Go test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go build -o /tmp/api ./cmd/api

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [check, go]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t kalke-auth:ci .

  deploy:
    name: Deploy to Cloudflare Containers
    needs: [check, go, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy Worker + Container
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.88.0"
          command: deploy
          secrets: |
            KC_DB_URL
            KC_DB_USERNAME
            KC_DB_PASSWORD
            KC_BOOTSTRAP_ADMIN_USERNAME
            KC_BOOTSTRAP_ADMIN_PASSWORD
            DATABASE_URL
            REDIS_ADDR
            REDIS_PASSWORD
            SESSION_SECRET
            TOKEN_HASH_PEPPER
            INTROSPECT_SECRET
            KC_BFF_CLIENT_SECRET
            MAILGUN_API_KEY
            MAILGUN_DOMAIN
        env:
          KC_DB_URL: ${{ secrets.KC_DB_URL }}
          KC_DB_USERNAME: ${{ secrets.KC_DB_USERNAME }}
          KC_DB_PASSWORD: ${{ secrets.KC_DB_PASSWORD }}
          KC_BOOTSTRAP_ADMIN_USERNAME: ${{ secrets.KC_BOOTSTRAP_ADMIN_USERNAME }}
          KC_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.KC_BOOTSTRAP_ADMIN_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_ADDR: ${{ secrets.REDIS_ADDR }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TOKEN_HASH_PEPPER: ${{ secrets.TOKEN_HASH_PEPPER }}
          INTROSPECT_SECRET: ${{ secrets.INTROSPECT_SECRET }}
          KC_BFF_CLIENT_SECRET: ${{ secrets.KC_BFF_CLIENT_SECRET }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
