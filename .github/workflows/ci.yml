name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - name: Validate realm JSON
        run: npm run check
      - name: Go vet
        run: go vet ./...
      - name: Go fmt check
        run: test -z "$(gofmt -l .)"

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go build -o /tmp/api ./cmd/api

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: gosec
        uses: securego/gosec@master
        with:
          args: -severity high ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: trivy fs (non-blocking)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t kalke-auth:ci .

  deploy:
    name: Deploy
    # Self-hosted on EC2 — GitHub-hosted SSH to :22 times out (security group).
    runs-on: [self-hosted, linux, kalke-auth-ec2]
    needs: [lint, test, security, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    steps:
      - name: Update and restart stack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_DIR: /home/ubuntu/kalke-auth
          PDE_BASE_URL: ${{ secrets.PDE_BASE_URL }}
          PDE_M2M_CLIENT_ID: ${{ secrets.PDE_M2M_CLIENT_ID }}
          PDE_M2M_CLIENT_SECRET: ${{ secrets.PDE_M2M_CLIENT_SECRET }}
          PDE_USER_FORWARD_SECRET: ${{ secrets.PDE_USER_FORWARD_SECRET }}
          EBANK_BASE_URL: ${{ secrets.EBANK_BASE_URL }}
          EBANK_M2M_CLIENT_ID: ${{ secrets.EBANK_M2M_CLIENT_ID }}
          EBANK_M2M_CLIENT_SECRET: ${{ secrets.EBANK_M2M_CLIENT_SECRET }}
          EBANK_USER_FORWARD_SECRET: ${{ secrets.EBANK_USER_FORWARD_SECRET }}
        run: |
          set -euo pipefail
          chmod +x "${REPO_DIR}/deploy/remote-update.sh"
          bash "${REPO_DIR}/deploy/remote-update.sh"
