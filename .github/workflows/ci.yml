name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate realm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check

  go:
    name: Go test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go build -o /tmp/api ./cmd/api

  security:
    name: Security scanners
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gosec
        uses: securego/gosec@master
        with:
          args: ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: trivy fs (non-blocking)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [check, go, security]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t kalke-auth:ci .

  deploy:
    name: Deploy to AWS EC2
    needs: [check, go, security, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          command_timeout: 40m
          script_stop: true
          envs: GH_TOKEN
          script: |
            set -euo pipefail
            chmod +x "${HOME}/kalke-auth/deploy/remote-update.sh" 2>/dev/null || true
            if [[ -x "${HOME}/kalke-auth/deploy/remote-update.sh" ]]; then
              bash "${HOME}/kalke-auth/deploy/remote-update.sh"
            else
              # First deploy / before script lands on the host: bootstrap update inline.
              REPO_DIR="${HOME}/kalke-auth"
              if [[ ! -d "${REPO_DIR}/.git" ]]; then
                git clone "https://x-access-token:${GH_TOKEN}@github.com/kalke/kalke-auth.git" "${REPO_DIR}"
              fi
              cd "${REPO_DIR}"
              test -f prod.env
              git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/kalke/kalke-auth.git"
              git fetch --depth=1 origin main
              git checkout -B main FETCH_HEAD
              git remote set-url origin "https://github.com/kalke/kalke-auth.git"
              make aws-up
            fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: thin Cloudflare Worker proxy in front of the EC2 origin.
  deploy-worker:
    name: Deploy optional Worker proxy
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_CF_WORKER == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy Worker proxy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.88.0"
          command: deploy
          secrets: |
            ORIGIN_URL
        env:
          ORIGIN_URL: ${{ secrets.ORIGIN_URL }}
