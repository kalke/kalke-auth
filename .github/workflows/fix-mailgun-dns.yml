name: fix-mailgun-dns

on:
  workflow_dispatch:

jobs:
  mx:
    runs-on: ubuntu-latest
    steps:
      - name: Add Mailgun MX for noreply.kalke.dev
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ZONE_ID="$(curl -sS -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=kalke.dev" \
            | python3 -c 'import sys,json; r=json.load(sys.stdin); assert r.get("success"), r; print(r["result"][0]["id"])')"
          echo "zone=${ZONE_ID}"
          existing="$(curl -sS -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=MX&name=noreply.kalke.dev&per_page=50")"
          echo "$existing" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("existing", [(x["content"], x.get("priority")) for x in d.get("result") or []]); print("success", d.get("success"), d.get("errors"))'
          for mx in mxa.mailgun.org mxb.mailgun.org; do
            if echo "$existing" | python3 -c "import sys,json; d=json.load(sys.stdin); raise SystemExit(0 if any(x.get('content')=='${mx}' for x in d.get('result') or []) else 1)"; then
              echo "skip ${mx}"
              continue
            fi
            curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"MX\",\"name\":\"noreply\",\"content\":\"${mx}\",\"priority\":10,\"ttl\":3600}" \
              | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("success"), d.get("errors"), (d.get("result") or {}).get("name"), (d.get("result") or {}).get("content"))'
          done
