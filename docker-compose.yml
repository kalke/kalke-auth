services:
  # Named kc-db so DNS never collides with other stacks' "postgres" on shared networks.
  kc-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${KC_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      POSTGRES_DB: ${KC_DB_NAME:-keycloak}
    volumes:
      - kc_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - kalke-auth

  # App DB for sessions / PATs (separate from Keycloak).
  app-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kalke
      POSTGRES_PASSWORD: kalke
      POSTGRES_DB: kalke
    volumes:
      - app_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalke -d kalke"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - kalke-auth

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - kalke-auth

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    depends_on:
      kc-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://kc-db:5432/${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8443}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      # Dev realm only — do not mount kalke-realm.prod.json here.
      - ./keycloak/kalke-realm.json:/opt/keycloak/data/import/kalke-realm.json:ro
    networks:
      - kalke-auth
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  bff:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: kalke-auth-bff:local
    depends_on:
      app-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    env_file:
      - path: local.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://kalke:kalke@app-db:5432/kalke?sslmode=disable}
      DB_SEARCH_PATH: ${DB_SEARCH_PATH:-app}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_TLS: ${REDIS_TLS:-false}
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-session-secret-do-not-use-in-prod}
      TOKEN_HASH_PEPPER: ${TOKEN_HASH_PEPPER:-local-dev-token-pepper-do-not-use-in-prod}
      INTROSPECT_SECRET: ${INTROSPECT_SECRET:-local-dev-introspect-secret}
      KC_BFF_CLIENT_ID: ${KC_BFF_CLIENT_ID:-kalke-bff}
      KC_BFF_CLIENT_SECRET: ${KC_BFF_CLIENT_SECRET:-kalke-bff-dev-secret}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_INTERNAL_URL: ${KC_INTERNAL_URL:-http://keycloak:8080}
      KC_PUBLIC_ISSUER: ${KC_PUBLIC_ISSUER:-http://localhost:8443/realms/kalke}
      HTTP_ADDR: ":8080"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      COOKIE_DOMAIN: ""
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      MAIL_DEV_LOG: ${MAIL_DEV_LOG:-true}
      MAIL_FROM: ${MAIL_FROM:-kalke <noreply@localhost>}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-demo@kalke.local}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:8090/v1/auth/callback}
      OAUTH_SUCCESS_URL: ${OAUTH_SUCCESS_URL:-http://localhost:5173/playground}
      PDE_BASE_URL: ${PDE_BASE_URL:-http://api:8080}
      PDE_M2M_CLIENT_ID: ${PDE_M2M_CLIENT_ID:-pde-m2m}
      PDE_M2M_CLIENT_SECRET: ${PDE_M2M_CLIENT_SECRET:-pde-m2m-dev-secret}
      PDE_USER_FORWARD_SECRET: ${PDE_USER_FORWARD_SECRET:-local-dev-m2m-forward-secret}
    ports:
      - "${BFF_BIND:-127.0.0.1}:${BFF_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - kalke-auth

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      keycloak:
        condition: service_started
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:${PUBLIC_PORT:-8443}:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - kalke-auth

volumes:
  kc_pgdata:
  app_pgdata:

networks:
  kalke-auth:
    name: kalke-auth
    driver: bridge
